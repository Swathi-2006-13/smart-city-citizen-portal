href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

<div class="logo">

<p>Citizen Service Portal</p>

<!-- ================= PAGE TITLE ================= -->

<section class="page-banner">

<h1>Request a Smart City Service</h1>

<p>
Fill in the form below to submit your service request.
</p>

</section>

<!-- ================= FORM ================= -->

<section class="request-section">

<div class="request-form">

<h2>Citizen Service Request Form</h2>

<form>

<div class="row">

<div class="input-box">

<label>Full Name</label>

<input type="text" placeholder="Enter your name" required>

</div>

<div class="input-box">

<label>Email Address</label>

<input type="email" placeholder="Enter your email" required>

</div>

</div>

<div class="row">

<div class="input-box">

<label>Phone Number</label>

<input type="tel" placeholder="Enter phone number" required>

</div>

<div class="input-box">

<label>Place</label>

<input type="text" placeholder="Enter place" required>

</div>

</div>

<div class="input-box">

<label>Address</label>

<textarea rows="3" placeholder="Enter address"></textarea>

</div>

<div class="row">

<div class="input-box">

<label>Area / Locality</label>

<input type="text">

</div>

<div class="input-box">

<label>Ward Number</label>

<input type="number">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Complaint Category</label>

<select>

<option>Select Category</option>

<option>Water Supply</option>

<option>Electricity</option>

<option>Road Maintenance</option>

<option>Street Light</option>

<option>Waste Management</option>

<option>Public Safety</option>

<option>Environment</option>

<option>Transport</option>

<option>Healthcare</option>

<option>Building Approval</option>

</select>

</div>

<div class="input-box">

<label>Service Required</label>

<select>

<option>Select Service</option>

<option>Repair</option>

<option>Installation</option>

<option>Inspection</option>

<option>Maintenance</option>

<option>Emergency Support</option>

</select>

</div>

</div>

<div class="row">

<div class="input-box">

<label>Priority</label>

<select>

<option>Low</option>

<option>Medium</option>

<option>High</option>

</select>

</div>

<div class="input-box">

<label>Preferred Contact</label>

<select>

<option>Phone Call</option>

<option>Email</option>

<option>SMS</option>

</select>

</div>

</div>

<div class="row">

<div class="input-box">

<label>Preferred Date</label>

<input type="date">

</div>

<div class="input-box">

<label>Preferred Time</label>

<input type="time">

</div>

</div>

<div class="input-box">

<label>Upload Image</label>

<input type="file">

</div>

<div class="input-box">

<label>Complaint Description</label>

<textarea rows="6"
placeholder="Describe your complaint clearly..."></textarea>

</div>

<div class="button-group">

<input type="submit" value="Submit Request">

<input type="reset" value="Reset Form">

</div>

</form>

</div>

</section>

<!-- ================= FOOTER ================= -->

<footer>

<div class="footer-social">

<i class="fab fa-facebook"></i>

<i class="fab fa-twitter"></i>

<i class="fab fa-instagram"></i>

<i class="fab fa-youtube"></i>

</div>

<p>

© 2026 Smart City Citizen Service Portal

</p>

</footer>

</body>

</html>
