
<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint | Smart City Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

 <body>

 <header>
    <h1>SMART CITY</h1>
    <p>Citizen Service Portal</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="request.html">Submit Complaint</a>
        <a href="track.html">Track Complaint</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="request-section">

    <h2>Submit Your Complaint</h2>
    <p>Enter the details below to register your complaint.</p>

    <div class="request-form">

        <form id="requestForm" enctype="multipart/form-data">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter phone number"
                   required>

            <label for="place">Place</label>
            <input type="text" id="place" name="place"
                   placeholder="Enter place"
                   required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address"
                   placeholder="Enter complete address"
                   required>

            <label for="area">Area</label>
            <input type="text" id="area" name="area"
                   placeholder="Enter area"
                   required>

            <label for="wardNumber">Ward Number</label>
            <input type="text" id="wardNumber" name="wardNumber"
                   placeholder="Enter ward number"
                   required>

            <label for="category">Complaint Category</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Road Damage">Road Damage</option>
                <option value="Pothole">Pothole</option>
                <option value="Streetlight">Streetlight</option>
                <option value="Garbage">Garbage</option>
                <option value="Water Leakage">Water Leakage</option>
                <option value="Open Manhole">Open Manhole</option>
                <option value="Accident">Accident</option>
            </select>

            <label for="serviceRequired">Service Required</label>
            <select id="serviceRequired" name="serviceRequired" required>
                <option value="">Select Service</option>
                <option value="Road Maintenance">Road Maintenance</option>
                <option value="Streetlight Repair">Streetlight Repair</option>
                <option value="Waste Management">Waste Management</option>
                <option value="Water Supply">Water Supply</option>
                <option value="Public Safety">Public Safety</option>
                <option value="Other">Other</option>
            </select>

            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="">Select Priority</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="URGENT">Urgent</option>
            </select>

            <label for="preferredContact">Preferred Contact</label>
            <select id="preferredContact" name="preferredContact" required>
                <option value="">Select Contact Method</option>
                <option value="Phone">Phone</option>
                <option value="Email">Email</option>
            </select>

            <label for="preferredDate">Preferred Date</label>
            <input type="date" id="preferredDate" name="preferredDate">

            <label for="preferredTime">Preferred Time</label>
            <input type="time" id="preferredTime" name="preferredTime">

            <label for="image">Upload Image</label>
            <input type="file" id="image" name="image"
                   accept="image/jpeg,image/png,image/webp">

            <label for="description">Complaint Description</label>
            <textarea id="description" name="description"
                      rows="5" maxlength="5000"
                      placeholder="Describe your complaint..."
                      required></textarea>

            <button type="submit" id="submitButton">
                Submit Request
            </button>

            <button type="reset">
                Reset Form
            </button>

        </form>

    </div>
</main>

<footer>
    <p>&copy; 2026 Smart City Citizen Service Portal</p>
</footer>

<script src="js/script.js?v=2"></script>

</body>
 </html>
